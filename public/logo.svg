<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="60" cy="60" r="58" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Main V shape with code brackets -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M35 45 L25 60 L35 75" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Main V -->
    <path d="M40 40 L60 80 L80 40" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Right bracket > -->
    <path d="M85 45 L95 60 L85 75" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Accent dots -->
  <circle cx="25" cy="60" r="2" fill="url(#grad2)"/>
  <circle cx="95" cy="60" r="2" fill="url(#grad2)"/>
  
  <!-- Subtle shine effect -->
  <path d="M45 42 L55 42" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
